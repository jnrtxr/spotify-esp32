; ============================================================
; PlatformIO Configuration - ESP32 Spotify Now Playing
; ============================================================
; Board: ESP32-2432S028R (Cheap Yellow Display / CYD)
; Display: ILI9341 240x320 2.8" com touch resistivo
; Framework: Arduino
; ============================================================

[env:esp32cyd]
platform = espressif32@~6.9.0
board = esp32dev
framework = arduino

; Força framework Arduino-ESP32 v2.x (compatível com o toolchain)
platform_packages =
    framework-arduinoespressif32 @ ~3.20014.0

; Configuração de memória
board_build.arduino.memory_type = qio_qspi
build_flags =
    ; --- TFT_eSPI: ESP32-2432S028R (CYD) ILI9341 240x320 ---
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; Pinos SPI do display (fixos na placa CYD)
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    ; Backlight controlado por GPIO 21
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; Correção de cores e inversão (necessário para CYD)
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_BGR
    ; Velocidade SPI
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    ; Fonte suave para textos bonitos
    -DSMOOTH_FONT=1
    ; Fontes bitmap (OBRIGATÓRIO para drawString funcionar)
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    ; Rotação (0=retrato, 1=paisagem, 2=retrato invertido, 3=paisagem invertida)
    -DTFT_ROTATION=1
    ; ArduinoJson
    -DARDUINOJSON_ENABLE_PROGMEM=1

; Monitor serial
monitor_speed = 115200

; Bibliotecas necessárias
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0
    bblanchon/ArduinoJson@^7.1.0
    tzapu/WiFiManager@^2.0.17

; Partição com espaço para NVS e OTA
board_build.partitions = huge_app.csv
