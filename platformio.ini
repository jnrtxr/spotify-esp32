; ============================================================
; PlatformIO Configuration - ESP32 Spotify Now Playing
; ============================================================
; Board: ESP32-WROVER (com PSRAM)
; Framework: Arduino
; ============================================================

[env:esp32wrover]
platform = espressif32
board = esp-wrover-kit
framework = arduino

; Habilita PSRAM para buffers de imagem
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC
    ; --- TFT_eSPI: configuração do display ST7789 240x240 ---
    ; Seleciona o driver
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    ; Pinos SPI (ajuste conforme sua fiação)
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DTFT_BL=4
    ; Velocidade SPI
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    ; Fonte suave para textos bonitos
    -DSMOOTH_FONT=1
    ; Rotação padrão (0-3)
    -DTFT_ROTATION=0
    ; ArduinoJson - desabilita modo de documento (economia de RAM)
    -DARDUINOJSON_ENABLE_PROGMEM=1

; Monitor serial
monitor_speed = 115200

; Bibliotecas necessárias
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0
    bblanchon/ArduinoJson@^7.1.0
    tzapu/WiFiManager@^2.0.17

; Partição com espaço para NVS e OTA
board_build.partitions = huge_app.csv
